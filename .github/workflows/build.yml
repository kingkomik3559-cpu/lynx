name: Compile Lynx for macOS
on: [push, workflow_dispatch] # workflow_dispatch adds a manual "Run" button
jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Build Dependencies
        run: |
          brew install openssl bzip2 ncurses pkg-config

      - name: Download and Unpack Lynx Source Code
        run: |
          curl -fSL https://invisible-island.net/archives/lynx/tarballs/lynx2.9.3.tar.gz -o lynx.tar.gz
          tar -xf lynx.tar.gz
          mv lynx2.9.3 lynx-source

      - name: Force static linking of Homebrew libraries
        run: |
          mkdir -p /tmp/dylib-backup
          for prefix in "$(brew --prefix ncurses)" "$(brew --prefix openssl)" "$(brew --prefix bzip2)"; do
            find "$prefix/lib" -name "*.dylib" -exec mv {} /tmp/dylib-backup/ \;
          done

      - name: Configure and Compile Lynx
        run: |
          cd lynx-source

          export LDFLAGS="-L$(brew --prefix openssl)/lib -L$(brew --prefix ncurses)/lib -L$(brew --prefix bzip2)/lib"
          export CPPFLAGS="-I$(brew --prefix openssl)/include -I$(brew --prefix ncurses)/include -I$(brew --prefix bzip2)/include"
          export PKG_CONFIG_PATH="$(brew --prefix openssl)/lib/pkgconfig:$(brew --prefix ncurses)/lib/pkgconfig"

          ./configure \
            --prefix=$GITHUB_WORKSPACE/lynx-bin \
            --with-ssl \
            --with-screen=ncursesw \
            --with-zlib \
            --with-bzlib \
            --enable-ipv6 \
            --enable-locale-charset

          make
          make install

      - name: Create self-locating launcher script
        run: |
          mkdir -p lynx-bin/share
          cp -R "$(brew --prefix ncurses)/share/terminfo" lynx-bin/share/terminfo

          # Statically-linked OpenSSL still needs a CA certificate bundle at
          # runtime to verify HTTPS sites - that's data, not code, so it
          # wasn't pulled in by static linking. Bundle the standard
          # curl/Mozilla trust bundle so HTTPS works without prompting.
          curl -fSL https://curl.se/ca/cacert.pem -o lynx-bin/etc/cacert.pem

          cat > lynx-bin/etc/mime.types << 'EOF'
          image/jpeg    jpg jpeg jpe
          image/png     png
          image/gif     gif
          image/webp    webp
          image/bmp     bmp
          image/tiff    tif tiff
          image/heic    heic
          video/mp4     mp4 m4v
          video/quicktime mov
          video/x-matroska mkv
          video/webm    webm
          video/mpeg    mpeg mpg
          EOF

          cat > lynx-bin/etc/mailcap << 'EOF'
          image/*; open -a Preview.app %s
          video/*; __MPV_PATH__ %s
          EOF

          cd lynx-bin/bin
          mv lynx lynx-real
          cat > lynx << 'EOF'
          #!/bin/bash
          # Resolve the real path to this script's directory, even if invoked
          # via a symlink or from a different working directory.
          SOURCE="${BASH_SOURCE[0]}"
          while [ -L "$SOURCE" ]; do
            DIR="$(cd -P "$(dirname "$SOURCE")" >/dev/null 2>&1 && pwd)"
            SOURCE="$(readlink "$SOURCE")"
            [[ $SOURCE != /* ]] && SOURCE="$DIR/$SOURCE"
          done
          BIN_DIR="$(cd -P "$(dirname "$SOURCE")" >/dev/null 2>&1 && pwd)"
          ROOT_DIR="$(cd "$BIN_DIR/.." >/dev/null 2>&1 && pwd)"
          export TERMINFO="$ROOT_DIR/share/terminfo"
          export SSL_CERT_FILE="$ROOT_DIR/etc/cacert.pem"

          MAILCAP_TMP="$(mktemp)"
          if [ -x "$ROOT_DIR/mpv/bin/mpv" ]; then
            MPV_PATH="$ROOT_DIR/mpv/bin/mpv"
          else
            MPV_PATH="mpv"
          fi
          sed "s#__MPV_PATH__#$MPV_PATH#" "$ROOT_DIR/etc/mailcap" > "$MAILCAP_TMP"

          exec "$BIN_DIR/lynx-real" -cfg="$ROOT_DIR/etc/lynx.cfg" -lss="$ROOT_DIR/etc/lynx.lss" -mime_types="$ROOT_DIR/etc/mime.types" -mailcap="$MAILCAP_TMP" "$@"
          EOF
          chmod +x lynx

      - name: Verify no Homebrew dependencies remain linked
        run: |
          otool -L lynx-bin/bin/lynx-real | grep -i homebrew || echo "Clean — no Homebrew paths linked."

      - name: Compress and Upload Lynx Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Lynx-Executable-${{ github.run_id }}-${{ github.run_attempt }}
          path: lynx-bin/
